# Core drivers used by the DWM1001 module.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_WATCHDOG=y

# The application talks to DW1000 registers directly because Zephyr's generic
# IEEE 802.15.4 driver does not expose delayed-TX/ranging timestamps required
# by this protocol state machine.
CONFIG_IEEE802154=n
CONFIG_IEEE802154_DW1000=n

# UART0 is reserved for framed telemetry. Keep all consoles/loggers away from it.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0

# Project defaults; config/*.conf selects the node role/address.
CONFIG_UWB_DS_TWR=y
CONFIG_UWB_COMPENSATION_LEGACY=y
CONFIG_UWB_CLOCK_CORRECTION=n
CONFIG_UWB_WATCHDOG=y
CONFIG_UWB_WATCHDOG_TIMEOUT_MS=1000
