# spi2 is disabled in the overlay so Zephyr does not own the peripheral.
# Nordic pinctrl conditionally compiles its SPIM pin functions only when an
# enabled SPIM DT node exists OR CONFIG_NRFX_SPIM is selected. Keep that
# support present for the application's pinctrl_apply_state() call.
# No SPIM instance is enabled and the application still owns SPIM2 directly.
CONFIG_NRFX_SPIM=y
# nRF52832 has a single-precision FPU. Retain exact int64/double DS math;
# signal diagnostics and filters use float and benefit from hardware FP.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
