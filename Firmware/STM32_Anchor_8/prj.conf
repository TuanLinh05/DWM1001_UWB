# STM32F103C8T6: 64 KiB flash / 20 KiB RAM.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=n
CONFIG_WATCHDOG=y
CONFIG_TIMING_FUNCTIONS=y

# The DW1000 is driven through the project's register-level SPI driver.
CONFIG_IEEE802154=n
CONFIG_IEEE802154_DW1000=n

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_HWINFO=y
CONFIG_REBOOT=y
# STM32F103 has no hardware RNG. The platform mixes DWT, uptime and UID.
CONFIG_ENTROPY_GENERATOR=n
