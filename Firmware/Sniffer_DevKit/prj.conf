# DWM1001-DEV passive UWB sniffer: DW1000 SPI/GPIO, UART to the host.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_WATCHDOG=y
CONFIG_TIMING_FUNCTIONS=y

CONFIG_IEEE802154=n
CONFIG_IEEE802154_DW1000=n

# UART0 carries only binary sniffer frames.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0

# Health: reset cause, controlled reboot, RNG for the per-boot ID.
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
