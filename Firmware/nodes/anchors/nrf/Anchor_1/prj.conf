# Anchor 1 only needs the DW1000 SPI/GPIO interface and watchdog.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=n
CONFIG_WATCHDOG=y
CONFIG_TIMING_FUNCTIONS=y

# Ranging needs delayed TX and 40-bit timestamps, so the application uses the
# register-level DW1000 driver instead of Zephyr's generic IEEE 802.15.4 API.
CONFIG_IEEE802154=n
CONFIG_IEEE802154_DW1000=n

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0

# Health: reset cause, controlled reboot, RNG for the per-boot ID.
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
