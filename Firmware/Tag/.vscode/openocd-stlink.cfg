# DWM1001C exposes the nRF52832 SWD pins on module pins 2 (SWD_CLK) and 3
# (SWD_DIO). Start at 400 kHz for a tolerant first connection. This ST-LINK
# V2 firmware supports OpenOCD's current direct-SWD driver, not legacy HLA.
source [find interface/stlink.cfg]
transport select swd
source [find target/nordic/nrf52.cfg]
adapter speed 400
